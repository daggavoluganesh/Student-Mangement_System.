<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }
        .box {
            width: 350px;
            margin: 120px auto;
            padding: 20px;
            background: white;
            text-align: center;
            box-shadow: 0 0 8px #aaa;
        }
        input, button {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Change Password</h2>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">
        <input type="password" name="old_password" placeholder="Old Password" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <button type="submit">Change Password</button>
    </form>

    <br>
    <a href="/student/forgot-password">Forgot Password?</a><br><br>
    <a href="/">Back to Dashboard</a>
</div>

</body>
</html>
